apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aks-demo-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/VarunJ-eng/aks-demo-gitops.git
    targetRevision: main
    path: test

  destination:
    server: https://kubernetes.default.svc
    namespace: test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
