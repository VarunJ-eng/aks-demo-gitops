apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/VarunJ-eng/aks-demo-gitops.git
    targetRevision: main
    path: monitoring/kube-prometheus-stack
    helm:
      releaseName: monitoring
      valueFiles:
        - values-prometheus.yaml
        - values-grafana.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
