
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aks-demo-app
  namespace: apps
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aks-demo-app
  template:
    metadata:
      labels:
        app: aks-demo-app
    spec:
      containers:
        - name: aks-demo-app
          image: varunaks1793257564.azurecr.io/aks-demo-app:bad4680
          ports:
            - containerPort: 80
          imagePullPolicy: IfNotPresent
